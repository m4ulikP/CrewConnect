<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CrewConnect — Phase 1.2.1 Editorial Visual Previews Gallery</title>
  <link rel="stylesheet" href="preview-theme.css">
  <style>
    body {
      background-color: var(--chrome);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .gallery-topbar {
      height: 58px;
      background-color: var(--surface);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-6);
      flex-shrink: 0;
    }
    .viewport-controls {
      display: flex;
      align-items: center;
      background: var(--ground);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 3px;
      gap: 2px;
    }
    .viewport-btn {
      padding: 5px 12px;
      border-radius: 4px;
      border: none;
      background: transparent;
      color: var(--ink-secondary);
      font-size: 12px;
      font-weight: 600;
      font-family: var(--font-sans);
      cursor: pointer;
      transition: background-color 150ms, color 150ms;
    }
    .viewport-btn.active {
      background: var(--surface);
      color: var(--ink-primary);
      box-shadow: 0 1px 2px rgba(24, 24, 27, 0.06);
    }
    .screen-tabs {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .screen-tab {
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-secondary);
      background: transparent;
      border: none;
      cursor: pointer;
      transition: background-color 150ms, color 150ms;
    }
    .screen-tab:hover {
      background-color: var(--ground);
      color: var(--ink-primary);
    }
    .screen-tab.active {
      background-color: var(--accent-tint);
      color: var(--accent);
      font-weight: 600;
    }
    .preview-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: var(--chrome);
      overflow: hidden;
    }
    .device-frame {
      background: var(--ground);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      box-shadow: 0 12px 32px rgba(24, 24, 27, 0.08);
      transition: width 260ms var(--ease-out), height 260ms var(--ease-out);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    iframe {
      border: none;
      width: 100%;
      height: 100%;
      flex: 1;
    }
  </style>
</head>
<body>

  <!-- Gallery Top Bar -->
  <header class="gallery-topbar">
    <div style="display: flex; align-items: center; gap: 16px;">
      <div class="brand-wordmark" style="font-size: 18px;">
        <span class="brand-dot"></span>
        <span>CrewConnect Visual Approval</span>
      </div>
      <span class="status-label status-open" style="font-size: 12px;">Editorial &bull; Alabaster &amp; Pine</span>
    </div>

    <!-- Screen Tabs -->
    <nav class="screen-tabs">
      <button class="screen-tab active" onclick="loadScreen('landing.html', this)">1. Landing</button>
      <button class="screen-tab" onclick="loadScreen('discovery.html', this)">2. Team Discovery</button>
      <button class="screen-tab" onclick="loadScreen('dashboard.html', this)">3. Dashboard</button>
      <button class="screen-tab" onclick="loadScreen('workspace.html', this)">4. Team Workspace</button>
      <button class="screen-tab" onclick="loadScreen('login.html', this)">5. Sign In</button>
      <button class="screen-tab" onclick="loadScreen('register.html', this)">6. Register</button>
    </nav>

    <!-- Viewport Width Controls -->
    <div class="viewport-controls">
      <button class="viewport-btn active" onclick="setViewport('100%', '100%', this)">Desktop (1440px)</button>
      <button class="viewport-btn" onclick="setViewport('768px', '96%', this)">Tablet (768px)</button>
      <button class="viewport-btn" onclick="setViewport('390px', '844px', this)">Mobile (390px)</button>
    </div>
  </header>

  <!-- Interactive Device Stage -->
  <div class="preview-stage">
    <div class="device-frame" id="frameContainer" style="width: 100%; height: 100%;">
      <iframe src="landing.html" id="previewIframe"></iframe>
    </div>
  </div>

  <script>
    function loadScreen(url, tabEl) {
      document.querySelectorAll('.screen-tab').forEach(t => t.classList.remove('active'));
      tabEl.classList.add('active');
      document.getElementById('previewIframe').src = url;
    }

    function setViewport(w, h, btnEl) {
      document.querySelectorAll('.viewport-btn').forEach(b => b.classList.remove('active'));
      btnEl.classList.add('active');
      const container = document.getElementById('frameContainer');
      container.style.width = w;
      container.style.height = h;
    }
  </script>

</body>
</html>
