name: CrewConnect CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-test-build:
    name: Build, Lint, Typecheck and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Start MongoDB Replica Set via Docker Compose
        run: |
          docker compose up -d
          npx tsx scripts/verify-replica-set.ts

      - name: Code format check
        run: npm run format

      - name: Lint across workspaces
        run: npm run lint

      - name: Typecheck across workspaces
        run: npm run typecheck

      - name: Run test suites
        env:
          MONGODB_URI: "mongodb://localhost:27017/crewconnect?replicaSet=rs0"
          JWT_SECRET: "ci_pipeline_secret_key_that_is_at_least_32_characters_long!"
        run: npm test

      - name: Build all packages and applications
        run: npm run build
