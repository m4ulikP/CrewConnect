name: CrewConnect CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-test-build:
    name: Build, Lint, Typecheck and Test
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --port 27017 --eval 'db.adminCommand({ ping: 1 })' --quiet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Initialize MongoDB single-node replica set
        run: |
          mongosh --port 27017 --eval 'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] })'
          sleep 2
          mongosh --port 27017 --eval 'rs.status()'

      - name: Typecheck across workspaces
        run: npm run typecheck

      - name: Run test suites
        env:
          MONGODB_URI: "mongodb://localhost:27017/crewconnect?replicaSet=rs0"
          JWT_SECRET: "ci_pipeline_secret_key_that_is_at_least_32_characters_long!"
        run: npm test

      - name: Build all packages and applications
        run: npm run build
