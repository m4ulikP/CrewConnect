services:
  mongodb:
    image: mongo:7.0
    container_name: crewconnect-prod-mongodb
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    # Internal network isolation: No host port published for unauthenticated MongoDB
    volumes:
      - prod-mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --port 27017 --eval 'db.adminCommand({ ping: 1 })' --quiet"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - crewconnect-net

  mongo-init:
    image: mongo:7.0
    container_name: crewconnect-prod-mongo-init
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint:
      - mongosh
      - --host
      - mongodb:27017
      - --eval
      - |
        try {
          const status = rs.status();
          if (status.ok === 1) {
            print("Replica set rs0 is already healthy.");
          }
        } catch (e) {
          print("Initiating replica set rs0 for container network...");
          const res = rs.initiate({
            _id: "rs0",
            members: [{ _id: 0, host: "mongodb:27017" }]
          });
          printjson(res);
        }
    networks:
      - crewconnect-net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: crewconnect-prod-api
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: ${CLIENT_URL:?CLIENT_URL environment variable is mandatory in production and must be set to the public deployment origin (e.g. https://crewconnect.yourdomain.com)}
      MONGODB_URI: mongodb://mongodb:27017/crewconnect?replicaSet=rs0
      MONGODB_DB_NAME: crewconnect
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET environment variable is mandatory in production and must be provided with a secure random key}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      JOIN_RATE_LIMIT_WINDOW_MS: ${JOIN_RATE_LIMIT_WINDOW_MS:-60000}
      JOIN_RATE_LIMIT_MAX_REQUESTS: ${JOIN_RATE_LIMIT_MAX_REQUESTS:-10}
    # No public port published for API: NGINX web service reverse-proxies /api/ and /socket.io/ internally
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - crewconnect-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: crewconnect-prod-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - crewconnect-net

volumes:
  prod-mongo-data:
    name: crewconnect-prod-mongo-data

networks:
  crewconnect-net:
    driver: bridge
