services:
  mongodb:
    image: mongo:7.0
    container_name: crewconnect-mongodb
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --port 27017 --eval 'db.adminCommand({ ping: 1 })' --quiet"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  mongo-init:
    image: mongo:7.0
    container_name: crewconnect-mongo-init
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint:
      - mongosh
      - --host
      - mongodb:27017
      - --eval
      - |
        let needInitiate = false;
        try {
          const status = rs.status();
          if (status.ok !== 1) {
            needInitiate = true;
          }
        } catch (e) {
          needInitiate = true;
        }

        if (needInitiate) {
          print("Initializing replica set rs0 for host and container access...");
          const res = rs.initiate({
            _id: "rs0",
            members: [{ _id: 0, host: "localhost:27017" }]
          });
          printjson(res);
        } else {
          print("Replica set rs0 is already initialized and healthy.");
        }

        print("Waiting for replica set primary election...");
        const maxAttempts = 30;
        let elected = false;

        for (let attempt = 1; attempt <= maxAttempts; attempt++) {
          try {
            const hello = db.adminCommand({ hello: 1 });
            if (hello.ok === 1 && (hello.isWritablePrimary === true || hello.primary)) {
              print("Replica set rs0 primary elected: " + (hello.primary || "local node"));
              elected = true;
              break;
            }
          } catch (err) {
            print("Attempt " + attempt + ": error querying hello command: " + err);
          }
          sleep(1000);
        }

        if (!elected) {
          print("FATAL: Replica set primary was NOT elected within timeout (30s)!");
          quit(1);
        }

        print("Replica set rs0 is ready with a writable primary.");

volumes:
  mongo-data:
    name: crewconnect-mongo-data
