<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#115E59" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CrewConnect — Race-proof hackathon team formation platform solving concurrency and seat allocation." />
    <title>CrewConnect — Race-Proof Hackathon Team Formation</title>
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("crewconnect-theme");
        } catch (e) {}

        var systemDark = false;
        try {
          systemDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        } catch (e) {}

        try {
          var isDark = stored === "dark" || (!stored && systemDark);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add("dark");
            root.setAttribute("data-theme", "dark");
            root.style.colorScheme = "dark";
          } else {
            root.classList.remove("dark");
            root.setAttribute("data-theme", "light");
            root.style.colorScheme = "light";
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-ground text-ink-primary antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
