<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .crew-rim {
        stroke: #FDFBF7;
        stroke-opacity: 0.22;
        stroke-width: 2.5px;
      }
      @media (prefers-color-scheme: dark) {
        .crew-rim {
          stroke: #FDFBF7;
          stroke-opacity: 0.35;
          stroke-width: 3px;
        }
      }
    </style>
  </defs>

  <!-- Architectural Deep Pine Squircle Container -->
  <rect width="512" height="512" rx="116" fill="#115E59" />

  <!-- Refined Contrast Rim (Enhances visibility across both light and dark browser themes) -->
  <rect class="crew-rim" x="3.5" y="3.5" width="505" height="505" rx="113" />

  <!-- The Bold Geometric 'C' -->
  <path d="M 391.04 161.95
    A 162 162 0 1 0 379.06 333.22
    A 32.0 32.0 0 0 0 327.28 295.60
    A 98 98 0 1 1 334.53 191.99
    A 32.0 32.0 0 0 0 391.04 161.95
    Z" fill="#FDFBF7" />

  <!-- Left Crew Member (Flanking) -->
  <g id="crew-left">
    <circle cx="196" cy="232" r="21" fill="#FDFBF7" />
    <path d="M 166 314 C 166 272 184 258 204 258 C 224 258 232 272 232 314 Z" fill="#FDFBF7" />
  </g>

  <!-- Right Crew Member (Flanking) -->
  <g id="crew-right">
    <circle cx="304" cy="232" r="21" fill="#FDFBF7" />
    <path d="M 268 314 C 268 272 276 258 296 258 C 316 258 334 272 334 314 Z" fill="#FDFBF7" />
  </g>

  <!-- Center Crew Member (Leader / Anchor) -->
  <g id="crew-center">
    <circle cx="250" cy="204" r="29" fill="#FDFBF7" />
    <path d="M 206 322 C 206 266 222 244 250 244 C 278 244 294 266 294 322 Z" fill="#FDFBF7" stroke="#115E59" stroke-width="4.5" stroke-linejoin="round" />
  </g>

  <!-- Dynamic Connecting Orbit Swoosh with Architectural Pine Knockout -->
  <path d="M 68 338 C 104 394 270 388 458 202 C 362 334 168 360 68 338 Z" fill="#FDE047" stroke="#115E59" stroke-width="5" stroke-linejoin="round" />
</svg>